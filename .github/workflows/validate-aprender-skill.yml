name: Validate aprender skill

on:
  pull_request:
    paths:
      - "skills/aprender-aprehender-revolucionar/**"
      - ".github/workflows/validate-aprender-skill.yml"
  push:
    branches: [main]
    paths:
      - "skills/aprender-aprehender-revolucionar/**"
      - ".github/workflows/validate-aprender-skill.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pytest
      - name: Test skill scripts
        run: >-
          python -m pytest
          skills/aprender-aprehender-revolucionar/scripts/tests
          -q
      - name: Compile skill scripts
        run: >-
          python -m compileall -q
          skills/aprender-aprehender-revolucionar/scripts
